name: Akış

# NBA tahmin sisteminin kendiliğinden çalışması. 15 dakikada bir tetiklenir; hangi akışın sırası geldiğine
# bulut.py karar verir (sabah, haftalık, maç öncesi, yaklaşan maç ya da hiçbiri). Yapılacak iş yoksa
# çalıştırma birkaç saniyede biter.
#
# Veritabanı (nba.db) depoda değil, "veri" adlı sürümün (release) ekinde durur: her çalıştırma onu indirir,
# iş bitince yerine yenisini koyar. Aynı anda iki çalıştırma veritabanını ezmesin diye çalıştırmalar sıraya girer.
#
# Tahmin üreten her çalıştırmanın sonunda web sayfası (GitHub Pages) yeniden derlenip yayımlanır. Sayfanın kendisi
# (sayfa/) değişince de yalnızca sayfa yeniden yayımlanır ("sayfa" akışı). Bilgisayar depoya yeni takip dosyası
# gönderince (takip_verisi/) dosyalar veritabanına işlenir ("takip" akışı).
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: [main]
    paths: ["sayfa/**", "sayfa_derle.py", "takip_verisi/**"]
  workflow_dispatch:
    inputs:
      kip:
        description: "Çalıştırılacak akış (otomatik: sırası geleni bulut.py seçer; sayfa: yalnızca web sayfasını yeniler; takip: depodaki takip dosyalarını işler)"
        type: choice
        default: otomatik
        options: [otomatik, sabah, mac_oncesi, yaklasan, haftalik, sayfa, takip]

permissions:
  contents: write          # veritabanını sürümün ekine yazmak için

concurrency:
  group: nba-veritabani
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NBA_VERI_KAYNAGI: cdn    # GitHub'ın makineleri stats.nba.com sorgularına yanıt alamıyor
  PYTHONUTF8: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  akis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sayfa: ${{ steps.derle.outputs.sayfa }}
    steps:
      - uses: actions/checkout@v7

      - name: Veritabanını indir
        run: |
          gh release download veri --pattern nba.db --repo "$GITHUB_REPOSITORY" || {
            echo "::warning::nba.db indirilemedi; bir önceki günün yedeği (nba-onceki.db) kullanılıyor"
            gh release download veri --pattern nba-onceki.db --repo "$GITHUB_REPOSITORY"
            mv nba-onceki.db nba.db
          }
          ls -l nba.db

      - name: Sırası gelen akışı seç
        id: karar
        env:
          ISTENEN: ${{ inputs.kip || 'otomatik' }}
          OLAY: ${{ github.event_name }}
          ONCEKI: ${{ github.event.before }}
        run: |
          if [ "$OLAY" = push ]; then
            # Gönderimde takip dosyası geldiyse veritabanına işlenir; yalnızca sayfa değiştiyse sayfa yenilenir.
            degisen=$(gh api "repos/$GITHUB_REPOSITORY/compare/$ONCEKI...$GITHUB_SHA" --jq '.files[].filename' || true)
            if grep -q '^takip_verisi/' <<< "$degisen"; then ISTENEN=takip; else ISTENEN=sayfa; fi
          fi
          python3 bulut.py karar "$ISTENEN" | tee -a "$GITHUB_OUTPUT"
          grep -E '^(kip|gerekce)=' "$GITHUB_OUTPUT" | sed 's/^kip=/Seçilen akış: /; s/^gerekce=/Gerekçe: /; s/$/  /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        if: steps.karar.outputs.kip != 'yok'
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-java@v6      # resmi sakatlık raporu (nbainjuries) Java ister
        if: contains(fromJSON('["sabah", "mac_oncesi", "yaklasan"]'), steps.karar.outputs.kip)
        with:
          distribution: temurin
          java-version: "21"

      - name: Bağımlılıkları kur
        if: steps.karar.outputs.kip != 'yok'
        run: pip install -r requirements.txt

      - name: Bir önceki günün yedeğini ayır
        if: steps.karar.outputs.kip == 'sabah'
        run: cp nba.db nba-onceki.db

      - name: Akışı çalıştır
        id: akis
        if: steps.karar.outputs.kip != 'yok'
        env:
          KIP: ${{ steps.karar.outputs.kip }}
        run: |
          basla=$SECONDS
          kod=0
          case "$KIP" in
            sabah)      python gunluk.py || kod=$? ;;
            mac_oncesi) python mac_oncesi.py || kod=$? ;;
            yaklasan)   python mac_oncesi.py --yaklasan "$(python -c 'import config; print(config.MAC_YAKLASAN_DK)')" || kod=$? ;;
            haftalik)   python haftalik.py || kod=$?
                        python bulut.py kaydet haftalik "$kod" "$((SECONDS - basla))" ;;
            sayfa)      python site_veri.py || kod=$? ;;      # veritabanını değiştirmez; yalnızca sayfa verisini yeniden üretir
            takip)      python yukle.py takip || kod=$?        # depodaki yeni takip dosyalarını veritabanına işler
                        python site_veri.py || kod=$? ;;
            *)          echo "::error::bilinmeyen akış: $KIP"; exit 1 ;;
          esac
          echo "kod=$kod" >> "$GITHUB_OUTPUT"
          echo "$KIP akışının çıkış kodu: $kod (0 tamam, 2 kritik olmayan adım başarısız, 1 kritik adım başarısız)"
          if [ "$kod" = 2 ]; then echo "::warning::$KIP akışı eksikle tamamlandı: kritik olmayan bir adım başarısız (ayrıntı özet sayfasında)"; fi

      - name: Veritabanını sakla
        if: always() && steps.karar.outputs.kip != 'yok' && steps.karar.outputs.kip != 'sayfa' && steps.karar.outputs.kip != ''
        run: |
          # Yarıda kesilmiş bir yazma varsa SQLite açılışta geri alır; bozuk dosya sürüme konmaz.
          python3 -c "import sqlite3, sys; s = sqlite3.connect('nba.db').execute('PRAGMA quick_check').fetchone()[0]; print('bütünlük denetimi:', s); sys.exit(s != 'ok')"
          yukle() {
            for deneme in 1 2 3; do
              gh release upload veri "$1" --clobber --repo "$GITHUB_REPOSITORY" && return 0
              echo "::warning::$1 yüklenemedi ($deneme. deneme)"; sleep 15
            done
            return 1
          }
          if [ -f nba-onceki.db ]; then yukle nba-onceki.db; fi
          yukle nba.db

      - name: Adım özeti
        if: always() && steps.karar.outputs.kip != 'yok' && steps.karar.outputs.kip != 'sayfa' && steps.karar.outputs.kip != ''
        run: python akis_ozeti.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.karar.outputs.kip != 'yok' && steps.karar.outputs.kip != ''
        with:
          name: akis-${{ steps.karar.outputs.kip }}-${{ github.run_number }}
          path: |
            log/
            raporlar/
            site_veri/
          if-no-files-found: ignore
          retention-days: 14

      # Bu çalıştırma sayfa verisi ürettiyse (site_veri/) web sayfasını derle; yayımlamayı aşağıdaki "sayfa" işi yapar.
      - name: Web sayfasını derle
        id: derle
        if: ${{ !cancelled() && steps.karar.outputs.kip != 'yok' && steps.karar.outputs.kip != '' }}
        run: |
          if [ -f site_veri/ozet.json ]; then
            python3 sayfa_derle.py _site | tee -a "$GITHUB_STEP_SUMMARY"
            echo "sayfa=var" >> "$GITHUB_OUTPUT"
          else
            echo "Bu çalıştırma sayfa verisi üretmedi; sayfa olduğu gibi kalıyor."
          fi

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() && steps.derle.outputs.sayfa == 'var' }}
        with:
          path: _site

      - name: Sonuç
        if: steps.karar.outputs.kip != 'yok'
        env:
          KOD: ${{ steps.akis.outputs.kod }}
        run: test "$KOD" = 0 || test "$KOD" = 2

  sayfa:
    name: Web sayfasını yayımla
    needs: akis
    if: ${{ !cancelled() && needs.akis.outputs.sayfa == 'var' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v5
